<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão HTML e CSS</title>
</head>
<body>
    <h1>Título nível 1</h1>
    <h6>Título nível 6</h6>
    <p>Esse é um paragrafo</p>
    <ol>
        <li>Posição 1</li>
        <li>Posição 2</li>
        <li>Posição 3</li>
    </ol>
    <ul>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>
    <a href="https://google.com.br">Clique aqui</a>
    <img src="img.png" alt="Foto de perfil" />
    <nav>
        <ul>
            <li>Item</li>
        </ul>
    </nav>
    <main>
        <p>Texto</p>
    </main>
    <div>
        <p>Texto</p>
        <p>Texto +<spam>Texto.</spam></p>
    </div>
    <table>
        <thead>
            <tr>
                <th>Coluna 1</th>
                <th>Coluna 2</th>
            </tr>
            <tbody>
                <tr>
                    <td>Dado 1</td>
                    <td>Dado 2</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Rodapé</td>
                </tr>
            </tfoot>
        </thead>
    </table>
    <form action="" method="">
        <label for="nome">Informe o nome:</label>
        <input type="text" id="nome" name="nome">
        <label for="desc">Descrição:</label>
        <textarea id="desc" name="desc"></textarea>
        <label for="opt">Opção:</label>
        <select id="opt" name="opt">
            <option value="1">Valor 1</option>
            <option value="2">Valor 2</option>
        </select>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
