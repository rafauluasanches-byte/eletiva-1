<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de exercício - Booststrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
      <form class="row g-3 needs-validation" novalidate style="margin: 12px;">
        <h1>Formulário 1</h1>
        <div class="col-md-4">
          <label for="validationCustom01" class="form-label">First name</label>
          <input type="text" class="form-control" id="validationCustom01" value="Mark" required>
          <div class="valid-feedback">
            Looks good!
          </div>
        </div>
        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Last name</label>
          <input type="text" class="form-control" id="validationCustom02" value="Otto" required>
          <div class="valid-feedback">
            Looks good!
          </div>
        </div>
        <div class="col-md-4">
          <label for="validationCustomUsername" class="form-label">Username</label>
          <div class="input-group has-validation">
            <span class="input-group-text" id="inputGroupPrepend">@</span>
            <input type="text" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
            <div class="invalid-feedback">
              Please choose a username.
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <label for="validationCustom03" class="form-label">City</label>
          <input type="text" class="form-control" id="validationCustom03" required>
          <div class="invalid-feedback">
            Please provide a valid city.
          </div>
        </div>
        <div class="col-md-3">
          <label for="validationCustom04" class="form-label">State</label>
          <select class="form-select" id="validationCustom04" required>
            <option selected disabled value="">Choose...</option>
            <option>...</option>
          </select>
          <div class="invalid-feedback">
            Please select a valid state.
          </div>
        </div>
        <div class="col-md-3">
          <label for="validationCustom05" class="form-label">Zip</label>
          <input type="text" class="form-control" id="validationCustom05" required>
          <div class="invalid-feedback">
            Please provide a valid zip.
          </div>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
            <label class="form-check-label" for="invalidCheck">
              Agree to terms and conditions
            </label>
            <div class="invalid-feedback">
              You must agree before submitting.
            </div>
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Submit form</button>
        </div>
      </form>


      <form style="margin: 12px;">
        <h1>Formulário 2</h1>
        <div class="row g-3">
          <div class="col-md-1">
            <label class="form-label">Código</label>
            <input type="text" class="form-control" value="32" disabled>
          </div>
          <div class="col-md-5">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" placeholder="Nome Completo do Cliente">
          </div>
          <div class="col-md-4">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" placeholder="cliente@dominio.com">
          </div>
          <div class="col-md-2">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" placeholder="Só números">
          </div>
          <div class="col-md-2">
            <label class="form-label">Nº Celular</label>
            <input type="text" class="form-control" placeholder="Nº do celular">
          </div>
          <div class="col-md-2">
            <label class="form-label">Nº Telefone fixo</label>
            <input type="text" class="form-control" placeholder="Nº telefone">
          </div>
          <div class="col-md-2">
            <label class="form-label">CEP</label>
            <input type="text" class="form-control" placeholder="ex:88308070">
          </div>
          <div class="col-md-2">
            <label class="form-label">Logradouro</label>
            <input type="text" class="form-control" placeholder="ex:Rua 1400,">
          </div>
          <div class="col-md-1">
            <label class="form-label">Nº</label>
            <input type="text" class="form-control" placeholder="Nº">
          </div>
          <div class="col-md-3">
            <label class="form-label">Bairro</label>
            <input type="text" class="form-control" placeholder="Bairro">
          </div>
          <div class="col-md-3">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" placeholder="Cidade">
          </div>
          <div class="col-md-1">
            <label class="form-label">UF</label>
            <input type="text" class="form-control" placeholder="UF">
          </div>
          <div class="col-md-2">
            <label class="form-label">Status</label>
            <select class="form-select">
              <option selected>Selecione</option>
              <option>Ativo</option>
              <option>Inativo</option>
            </select>
          </div>
          <div class="col-12 d-flex justify-content-end gap-2 mt-4">
            <button type="reset" class="btn btn-danger">Resetar</button>
            <button type="button" class="btn btn-success">Próximo</button>
          </div>
        </div>
      </form>
      

      <form style="margin: 15px;">
          <h1>Formulário 3</h1>
          <div class="row g-3 align-items-center">
            <div class="col-md-2 text-md-end">
              <label class="form-label">Partner Name</label>
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Partner Email ID</label>
            </div>
            <div class="col-md-4">
              <input type="email" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Partner Legal Name</label>
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Partner Mobile</label>
            </div>
            <div class="col-md-4">
              <input type="tel" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Partner Address</label>
            </div>
            <div class="col-md-10">
              <textarea class="form-control" rows="2"></textarea>
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Contract Start Date</label>
            </div>
            <div class="col-md-4">
              <input type="date" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Contract Expiry Date</label>
            </div>
            <div class="col-md-4">
              <input type="date" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Minimum Loan Amount</label>
            </div>
            <div class="col-md-4">
              <input type="number" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Maximum Loan Amount</label>
            </div>
            <div class="col-md-4">
              <input type="number" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Interest Rate</label>
            </div>
            <div class="col-md-4">
              <input type="number" step="0.01" class="form-control">
            </div>
            <div class="col-md-2 text-md-end">
              <label class="form-label">Deposit Amount</label>
            </div>
            <div class="col-md-4">
              <input type="number" step="0.01" class="form-control">
            </div>
            <div class="col-12 text-center mt-4">
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
      </form>
      
      <form class="row g-3" style="margin: 12px; background-color: rgb(239, 240, 238);">
        <h1>Formulário 5</h1>
        <div class="col-md-6">
          <label for="validationCustom01" class="form-label">First name</label>
          <input type="text" class="form-control" id="validationCustom01" value="Mark" required>
          <div class="valid-feedback">
            Looks good!
          </div>
        </div>
        <div class="col-md-6">
          <label for="validationCustom02" class="form-label">Last name</label>
          <input type="text" class="form-control" id="validationCustom02" value="Otto" required>
          <div class="valid-feedback">
            Looks good!
          </div>
        </div>
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">@</span>
          <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <div class="mb-3">
          <label for="exampleFormControlInput1" class="form-label">Email address (opcional)</label>
          <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>
        <div class="col-12">
          <label for="inputAddress" class="form-label">Address</label>
          <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
        </div>
        <div class="col-12">
          <label for="inputAddress2" class="form-label">Address 2</label>
          <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
        </div>
        <div class="col-md-6">
          <label for="inputCity" class="form-label">City</label>
          <input type="text" class="form-control" id="inputCity">
        </div>
        <div class="col-md-4">
          <label for="inputState" class="form-label">State</label>
          <select id="inputState" class="form-select">
            <option selected>Choose...</option>
            <option>...</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="inputZip" class="form-label">Zip</label>
          <input type="text" class="form-control" id="inputZip">
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck">
            <label class="form-check-label" for="gridCheck">
              Check me out
            </label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
  </form>
  </body>
</html>
